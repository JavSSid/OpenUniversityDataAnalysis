oulad:
  outputs:
    dev:
      type: bigquery
      method: service-account-json
      project: "{{ env_var('GCP_PROJECT_ID', 'oulad-platform') }}"
      dataset: bronze
      location: EU
      keyfile_json:
        private_key_id: "{{ env_var('BIGQUERY_PRIVATE_KEY_ID') }}"
        private_key: "{{ env_var('BIGQUERY_PRIVATE_KEY') }}"
        client_email: "{{ env_var('BIGQUERY_CLIENT_EMAIL') }}"
        client_id: "{{ env_var('BIGQUERY_CLIENT_ID', '') }}"
        client_x509_cert_url: "{{ env_var('BIGQUERY_CLIENT_CERT_URL', '') }}"
        type: service_account
        project_id: "{{ env_var('GCP_PROJECT_ID', 'oulad-platform') }}"
        auth_uri: https://accounts.google.com/o/oauth2/auth
        token_uri: https://oauth2.googleapis.com/token
        auth_provider_x509_cert_url: https://www.googleapis.com/oauth2/v1/certs
      threads: 4
      priority: interactive
      retries: 3
    prod:
      type: bigquery
      method: service-account-json
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: bronze
      location: EU
      keyfile_json:
        private_key_id: "{{ env_var('BIGQUERY_PRIVATE_KEY_ID') }}"
        private_key: "{{ env_var('BIGQUERY_PRIVATE_KEY') }}"
        client_email: "{{ env_var('BIGQUERY_CLIENT_EMAIL') }}"
        client_id: "{{ env_var('BIGQUERY_CLIENT_ID') }}"
        client_x509_cert_url: "{{ env_var('BIGQUERY_CLIENT_CERT_URL') }}"
        type: service_account
        project_id: "{{ env_var('GCP_PROJECT_ID') }}"
        auth_uri: https://accounts.google.com/o/oauth2/auth
        token_uri: https://oauth2.googleapis.com/token
        auth_provider_x509_cert_url: https://www.googleapis.com/oauth2/v1/certs
      threads: 8
      priority: interactive
      retries: 3
  target: dev
